<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Snake — Deluxe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <h1>🐍 WEB SNAKE <span class="title-suffix">DELUXE</span></h1>

    <div class="hud">
      <div>
        <span id="score">0</span> <em>score</em>
        <span id="best-num" class="best-num">0</span> <em>best</em>
      </div>
      <div class="hud-right">
        <span id="mute-ind" class="mute-ind">🔊</span>
        <span id="boost-ind" class="boost-ind" hidden>⚡</span>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="game-canvas" width="960" height="960"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-title">Ready?</p>
        <p id="overlay-message">Arrow keys or WASD to steer · Enter / Space to start</p>
      </div>
    </div>

    <div class="legend">
      <span>🍎 food</span>
      <span>⭐ boost</span>
      <span>🪨 obstacle</span>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
